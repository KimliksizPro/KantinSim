# GitHub Pages'a yayın: varsayılan dala her push'ta yalnız oyun dosyalarını yayınlar.
# Adres: https://kimliksizpro.github.io/KantinSim/
name: Pages'a yayınla

on:
  push:
    branches: [ccr-299ee556-k6f0la]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sözdizimi kontrolü
        run: for f in js/*.js; do node --check "$f"; done
      - name: Oyun dosyalarını topla
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg LICENSE.md css js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

# GitHub Pages'a yayın: varsayılan dala her push'ta yalnız oyun dosyalarını yayınlar.
# Adres: https://kimliksizpro.github.io/KantinSim/
name: Pages'a yayınla

on:
  push:
    branches: [ccr-299ee556-k6f0la]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sözdizimi kontrolü
        run: |
          for f in js/*.js; do node --check "$f"; done
          node --check sw.js
      - name: Oyun dosyalarını topla
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg LICENSE.md manifest.webmanifest sw.js icons css js _site/
          touch _site/.nojekyll
          # Önbellek sürümü: her yayında değişsin ki oyuncular eski dosyaları görmesin
          sed -i "s/const CACHE_VERSION = 'dev';/const CACHE_VERSION = '${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "kantinsim-${GITHUB_SHA::8}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
